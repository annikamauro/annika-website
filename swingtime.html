<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video</title>
    <link rel="stylesheet" href="styles.css"> <!-- if you have a shared CSS file -->
</head>
<body>

    <main>
        <h1>Audio & Video</h1>

        <!-- YouTube Embed -->
        <section>
            <h2>Choreography Video</h2>
            <div>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>

        <!-- call of the wild audio -->
        <section>
            <h2>Listen to this Audio</h2>
            <audio controls>
                <source src="path-to-your-audio-file.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Annika Mauro. All rights reserved.</p>
    </footer>
</body>
</html>
